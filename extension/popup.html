<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taveez</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 340px;
      background: #12100e;
      color: #f3ede2;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #1a1714 0%, #231f1c 100%);
      padding: 14px 16px 12px;
      border-bottom: 1px solid rgba(212,175,55,0.35);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #d4af37;
      letter-spacing: 0.03em;
      flex: 1;
    }
    .header-badge {
      background: rgba(212,175,55,0.15);
      border: 1px solid rgba(212,175,55,0.4);
      color: #d4af37;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 2px 7px;
      border-radius: 20px;
      text-transform: uppercase;
    }

    /* Canvas area */
    .canvas-wrap {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #0e0c0a;
      padding: 0;
      position: relative;
      height: 230px;
    }
    #charm-canvas {
      display: block;
      cursor: grab;
    }
    #charm-canvas:active { cursor: grabbing; }

    /* Charm selector row */
    .charm-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 12px 14px 8px;
      background: #16130f;
      border-top: 1px solid rgba(212,175,55,0.15);
    }
    .charm-btn {
      flex: 0 0 calc(20% - 5px);
      aspect-ratio: 1;
      font-size: 1.5rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(212,175,55,0.12);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .charm-btn:hover {
      background: rgba(212,175,55,0.15);
      border-color: rgba(212,175,55,0.4);
      transform: scale(1.1);
    }
    .charm-btn.active {
      background: rgba(212,175,55,0.2);
      border-color: #d4af37;
      box-shadow: 0 0 8px rgba(212,175,55,0.3);
    }

    /* Status bar */
    .statusbar {
      padding: 8px 14px 12px;
      background: #12100e;
      border-top: 1px solid rgba(212,175,55,0.1);
    }
    .status-msg {
      font-size: 0.78rem;
      color: rgba(243,237,226,0.55);
      text-align: center;
      min-height: 1.2em;
      transition: color 0.3s;
    }
    .status-msg.highlight { color: #d4af37; }

    /* Actions */
    .actions {
      display: flex;
      gap: 8px;
      padding: 0 14px 14px;
    }
    .action-btn {
      flex: 1;
      padding: 8px;
      background: rgba(212,175,55,0.08);
      border: 1px solid rgba(212,175,55,0.25);
      border-radius: 10px;
      color: #d4af37;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.02em;
    }
    .action-btn:hover {
      background: rgba(212,175,55,0.18);
      border-color: rgba(212,175,55,0.55);
    }
    .action-btn:active { transform: scale(0.96); }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-title">🧿 Taveez</div>
    <div class="header-badge">Active</div>
  </div>

  <div class="canvas-wrap">
    <canvas id="charm-canvas" width="340" height="230"></canvas>
  </div>

  <div class="charm-grid" id="charm-grid"></div>

  <div class="statusbar">
    <div class="status-msg" id="status-msg">Drag to swing • Click to bless</div>
  </div>

  <div class="actions">
    <button class="action-btn" id="btn-ritual">✨ Perform Ritual</button>
    <button class="action-btn" id="btn-flick">〰 Flick</button>
  </div>

  <script>
    // ---- Charm catalog ----
    const CHARMS = [
      { emoji: '🧿', name: 'Nazar' },
      { emoji: '🪬', name: 'Hamsa' },
      { emoji: '⛩️', name: 'Torii' },
      { emoji: '🐈‍⬛', name: 'Black Cat' },
      { emoji: '🕸️', name: 'Web' },
      { emoji: '🧲', name: 'Magnet' },
      { emoji: '🍀', name: 'Clover' },
      { emoji: '🔔', name: 'Bell' },
      { emoji: '🪙', name: 'Coin' },
      { emoji: '🌼', name: 'Flower' },
    ];

    const STORAGE_KEY = 'taveez_ext_charm';

    // ---- State ----
    let currentIdx = 0;
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const idx = CHARMS.findIndex(c => c.emoji === saved);
        if (idx !== -1) currentIdx = idx;
      }
    } catch(e) {}

    // ---- Build charm grid ----
    const grid = document.getElementById('charm-grid');
    CHARMS.forEach((c, i) => {
      const btn = document.createElement('button');
      btn.className = 'charm-btn' + (i === currentIdx ? ' active' : '');
      btn.textContent = c.emoji;
      btn.title = c.name;
      btn.addEventListener('click', () => {
        currentIdx = i;
        document.querySelectorAll('.charm-btn').forEach((b,j) =>
          b.classList.toggle('active', j === i)
        );
        try { localStorage.setItem(STORAGE_KEY, CHARMS[i].emoji); } catch(e) {}
        showStatus(`${CHARMS[i].emoji} ${CHARMS[i].name} selected`);
      });
      grid.appendChild(btn);
    });

    // ---- Physics Pendulum ----
    const canvas = document.getElementById('charm-canvas');
    const ctx = canvas.getContext('2d');

    let theta = 0.3;
    let omega = 0;
    const G = 9.81 * 60;
    const L = 150;
    const DAMP = 0.9;
    const OX = 170, OY = 12;

    let isDragging = false;
    let lastMouseX = 0;
    let lastMouseTime = 0;
    let lastMouseDX = 0;

    canvas.addEventListener('mousedown', e => {
      const rect = canvas.getBoundingClientRect();
      isDragging = true;
      lastMouseX = e.clientX - rect.left;
      lastMouseTime = performance.now();
    });
    window.addEventListener('mousemove', e => {
      if (!isDragging) return;
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      lastMouseDX = mx - lastMouseX;
      omega += (lastMouseDX / L) * 0.4;
      lastMouseX = mx;
      lastMouseTime = performance.now();
    });
    window.addEventListener('mouseup', () => { isDragging = false; });

    // Touch support
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      isDragging = true;
      lastMouseX = e.touches[0].clientX;
    }, { passive: false });
    window.addEventListener('touchmove', e => {
      if (!isDragging) return;
      const mx = e.touches[0].clientX;
      omega += ((mx - lastMouseX) / L) * 0.4;
      lastMouseX = mx;
    });
    window.addEventListener('touchend', () => { isDragging = false; });

    function drawBrassMount() {
      // Rail
      const grad = ctx.createLinearGradient(0, 0, 0, 12);
      grad.addColorStop(0, '#f0d060');
      grad.addColorStop(0.5, '#d4af37');
      grad.addColorStop(1, '#8b6914');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.roundRect(20, 2, 300, 10, 5);
      ctx.fill();

      // Mount screw
      ctx.fillStyle = '#8b6914';
      ctx.beginPath();
      ctx.arc(OX, OY, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#f0d060';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawBrassMount();

      const bobX = OX + L * Math.sin(theta);
      const bobY = OY + L * Math.cos(theta);

      // Thread with glow
      ctx.save();
      ctx.shadowColor = 'rgba(212,175,55,0.3)';
      ctx.shadowBlur = 4;
      ctx.beginPath();
      ctx.moveTo(OX, OY);
      ctx.lineTo(bobX, bobY);
      ctx.strokeStyle = '#c9a227';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();

      // Charm glow disc
      const grd = ctx.createRadialGradient(bobX, bobY, 0, bobX, bobY, 28);
      grd.addColorStop(0, 'rgba(212,175,55,0.12)');
      grd.addColorStop(1, 'rgba(212,175,55,0)');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(bobX, bobY, 28, 0, Math.PI * 2);
      ctx.fill();

      // Emoji
      ctx.save();
      ctx.translate(bobX, bobY);
      ctx.rotate(theta * 0.3);
      ctx.font = '38px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(CHARMS[currentIdx].emoji, 0, 0);
      ctx.restore();
    }

    function physicsLoop(now) {
      requestAnimationFrame(physicsLoop);
      const dt = 0.016;
      if (!isDragging) {
        const alpha = -(G / L) * Math.sin(theta) - DAMP * omega;
        omega += alpha * dt;
        theta += omega * dt;
        if (Math.abs(theta) < 0.001 && Math.abs(omega) < 0.001) {
          theta = 0; omega = 0;
        }
      }
      render();
    }
    requestAnimationFrame(physicsLoop);

    // ---- Audio ----
    function chime(freq = 587.33) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const c = new AudioCtx();
        [freq, freq * 1.5, freq * 2].forEach((f, i) => {
          const osc = c.createOscillator();
          const g = c.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, c.currentTime + i * 0.07);
          g.gain.setValueAtTime(0.15, c.currentTime + i * 0.07);
          g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + i * 0.07 + 1.4);
          osc.connect(g); g.connect(c.destination);
          osc.start(c.currentTime + i * 0.07);
          osc.stop(c.currentTime + i * 0.07 + 1.4);
        });
      } catch(e) {}
    }

    // ---- Status message ----
    const statusEl = document.getElementById('status-msg');
    function showStatus(msg, duration = 2500) {
      statusEl.textContent = msg;
      statusEl.classList.add('highlight');
      clearTimeout(showStatus._t);
      showStatus._t = setTimeout(() => {
        statusEl.textContent = 'Drag to swing • Click to bless';
        statusEl.classList.remove('highlight');
      }, duration);
    }

    // ---- Action buttons ----
    document.getElementById('btn-ritual').addEventListener('click', () => {
      chime();
      omega += (Math.random() > 0.5 ? 1 : -1) * 3;
      showStatus('✨ Blessed! May fortune find you.');
    });

    document.getElementById('btn-flick').addEventListener('click', () => {
      omega += (Math.random() > 0.5 ? 1 : -1) * 5;
      showStatus('〰 Flicked!');
    });

    // Click on canvas = ritual
    canvas.addEventListener('click', e => {
      if (Math.abs(lastMouseDX) < 3) {
        chime();
        omega += (Math.random() > 0.5 ? 1 : -1) * 2.5;
        showStatus(`✨ ${CHARMS[currentIdx].name} blesses you!`);
      }
    });
  </script>
</body>
</html>
