<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taveez</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 340px;
      background: #12100e;
      color: #f3ede2;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #1a1714 0%, #231f1c 100%);
      padding: 14px 16px 12px;
      border-bottom: 1px solid rgba(212,175,55,0.35);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #d4af37;
      letter-spacing: 0.03em;
      flex: 1;
    }
    .header-badge {
      background: rgba(212,175,55,0.15);
      border: 1px solid rgba(212,175,55,0.4);
      color: #d4af37;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 2px 7px;
      border-radius: 20px;
      text-transform: uppercase;
    }

    /* Canvas area */
    .canvas-wrap {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #0e0c0a;
      padding: 0;
      position: relative;
      height: 230px;
    }
    #charm-canvas {
      display: block;
      cursor: grab;
    }
    #charm-canvas:active { cursor: grabbing; }

    /* Charm selector row */
    .charm-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 12px 14px 8px;
      background: #16130f;
      border-top: 1px solid rgba(212,175,55,0.15);
    }
    .charm-btn {
      flex: 0 0 calc(20% - 5px);
      aspect-ratio: 1;
      font-size: 1.5rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(212,175,55,0.12);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .charm-btn:hover {
      background: rgba(212,175,55,0.15);
      border-color: rgba(212,175,55,0.4);
      transform: scale(1.1);
    }
    .charm-btn.active {
      background: rgba(212,175,55,0.2);
      border-color: #d4af37;
      box-shadow: 0 0 8px rgba(212,175,55,0.3);
    }

    /* Status bar */
    .statusbar {
      padding: 8px 14px 12px;
      background: #12100e;
      border-top: 1px solid rgba(212,175,55,0.1);
    }
    .status-msg {
      font-size: 0.78rem;
      color: rgba(243,237,226,0.55);
      text-align: center;
      min-height: 1.2em;
      transition: color 0.3s;
    }
    .status-msg.highlight { color: #d4af37; }

    /* Actions */
    .actions {
      display: flex;
      gap: 8px;
      padding: 0 14px 14px;
    }
    .action-btn {
      flex: 1;
      padding: 8px;
      background: rgba(212,175,55,0.08);
      border: 1px solid rgba(212,175,55,0.25);
      border-radius: 10px;
      color: #d4af37;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.02em;
    }
    .action-btn:hover {
      background: rgba(212,175,55,0.18);
      border-color: rgba(212,175,55,0.55);
    }
    .action-btn:active { transform: scale(0.96); }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-title">🧿 Taveez</div>
    <div class="header-badge">Active</div>
  </div>

  <div class="canvas-wrap">
    <canvas id="charm-canvas" width="340" height="230"></canvas>
  </div>

  <div class="charm-grid" id="charm-grid"></div>

  <div class="statusbar">
    <div class="status-msg" id="status-msg">Drag to swing • Click to bless</div>
  </div>

  <div class="actions">
    <button class="action-btn" id="btn-ritual">✨ Perform Ritual</button>
    <button class="action-btn" id="btn-flick">〰 Flick</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
